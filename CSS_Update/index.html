<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Update Page</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <h1>CSS Update Page</h1>
    <p>This is a simple page to demonstrate CSS updates.</p>
    <p id="altered-paragraph">Paragraph to be altered.</p>
    <form>
        <label for="border-r">Border R(0-255) Color:</label>
        <input type="text" id="border-r" placeholder="Enter Red value here...">
        <label for="border-g">Border G(0-255) Color:</label>
        <input type="text" id="border-g" placeholder="Enter Green value here...">
        <label for="border-b">Border B(0-255) Color:</label>
        <input type="text" id="border-b" placeholder="Enter Blue value here...">
        <label for="border-width">Border Width:</label>
        <input type="text" id="border-width" placeholder="Enter Border Width here...">
        <label for="background-r">Background R(0-255) Color:</label>
        <input type="text" id="background-r" placeholder="Enter Red value here...">
        <label for="background-g">Background G(0-255) Color:</label>
        <input type="text" id="background-g" placeholder="Enter Green value here...">
        <label for="background-b">Background B(0-255) Color:</label>
        <input type="text" id="background-b" placeholder="Enter Blue value here...">
        <label for="font-size">Font Size:</label>
        <input type="text" id="font-size" placeholder="Enter Font Size here...">
        <input type="button" value="Update CSS" id="update-css">
    </form>
    <script src="index.js"></script>
</body>
</html>
